name: Build Windows installer
on:
  push:
    paths:
      - 'app/**'
      - 'run.py'
      - 'requirements.txt'
      - 'installer/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check source
        run: python -m compileall -q app run.py
      - name: Build BhumajiAI
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BhumajiAI --collect-all sounddevice --collect-all soundfile --hidden-import keyring.backends.Windows --hidden-import keyboard run.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          & "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" installer/BhumajiAI.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "installer-output/BhumajiAI-Setup.exe")) { throw "Installer missing" }
          Get-FileHash installer-output/BhumajiAI-Setup.exe -Algorithm SHA256 | Format-List | Out-File installer-output/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BhumajiAI-Windows
          path: |
            installer-output/BhumajiAI-Setup.exe
            installer-output/SHA256.txt
          if-no-files-found: error
